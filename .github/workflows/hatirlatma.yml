name: Karar Takip - Günlük Hatırlatma Maili

on:
  schedule:
    # Her gün TSİ 08:00'de çalışır (UTC 05:00). GitHub Actions cron'u UTC kullanır.
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # İstersen "Actions" sekmesinden elle de tetikleyebilirsin

permissions:
  contents: write   # gönderim sonrası kararlar.json'daki hatırlatma kaydını commit edebilmek için

jobs:
  hatirlatma:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Hatırlatma scriptini çalıştır
        env:
          SMTP_HOST: mail.kurumsaleposta.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python hatirlatma_gonder.py

      - name: Güncellenen kararlar.json dosyasını kaydet (commit)
        run: |
          git config --global user.name "karar-takip-bot"
          git config --global user.email "bot@gemlik.bel.tr"
          git add kararlar.json
          git diff --cached --quiet || git commit -m "Otomatik hatırlatma günlüğü güncellendi"
          git push
